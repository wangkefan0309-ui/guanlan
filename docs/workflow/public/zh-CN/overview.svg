<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1552" role="img" aria-label="总览" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1550" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">总览</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 215 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">启动 / 打开 / 定时同步</text><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">选择收录或复用</text><path d="M 1005 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 765 298 H 803 V 730 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="790" y="514.0" transform="rotate(-90 790 514.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">直接打开原文或观看</text><path d="M 610 776 V 802.0 H 215 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 610 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">你选择深入处理</text><path d="M 610 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 215 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 1005 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="1227.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">明确要求归纳</text><path d="M 1005 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1352 V 1378.0 H 610 V 1404" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="1371.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">另行授权具体目标</text><g class="flow-node" data-node="sub" aria-label="固定订阅"><title>在信源里维护来源、分类、检查间隔和启停。X 作为可选渠道在远眺里使用。</title><rect x="60" y="108" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="127" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="143" fill="#216957" font-size="17" font-weight="650">固定订阅</text><text x="79" y="171" fill="#4d6069" font-size="12.8">公众号 · YouTube · B站 · RSS</text></g><g class="flow-node" data-node="explore" aria-label="兴趣探索"><title>按兴趣和八个板块检索，用轻处理模型筛选。自动探索可启用，当天最多生成一批，默认最多推荐三条。</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="143" fill="#70529a" font-size="17" font-weight="650">兴趣探索</text><text x="474" y="171" fill="#4d6069" font-size="12.8">综合网页 + 可选X + 近期订阅</text></g><g class="flow-node" data-node="manual" aria-label="手动添加材料"><title>可仅导入阅读，也可在导入时明确选择讨论或直接写入Wiki。</title><rect x="850" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="143" fill="#9a6119" font-size="17" font-weight="650">手动添加材料</text><text x="869" y="171" fill="#4d6069" font-size="12.8">链接 · MD · HTML · PDF · 字幕</text></g><g class="flow-node" data-node="ledger" aria-label="后台采集并保存"><title>后台定时检查，文章保存原件和正文，视频订阅先保存元数据与观看链接。增量feed由ledger-index.json和ledger-entries提供。</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="287" fill="#216957" font-size="17" font-weight="650">后台采集并保存</text><text x="79" y="315" fill="#4d6069" font-size="12.8">原页核验 → 去重 → 材料账本</text></g><g class="flow-node" data-node="cards" aria-label="远眺 · 推荐卡片"><title>推荐记录独立保存。外部推荐不会全部自动导入阅读库；近期订阅补充候选可复用已有正文。</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="287" fill="#70529a" font-size="17" font-weight="650">远眺 · 推荐卡片</text><text x="474" y="315" fill="#4d6069" font-size="12.8">保留理由、证据、原链接及缺口</text></g><g class="flow-node" data-node="import" aria-label="提取 / 导入 / 补文字稿"><title>扫描PDF不冒充OCR；视频先尝试公开字幕，受限时可导入自己的SRT/VTT。外部转换稿作为独立正文版本。</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="869" y="287" fill="#216957" font-size="17" font-weight="650">提取 / 导入 / 补文字稿</text><text x="869" y="315" fill="#4d6069" font-size="12.8">保留来源原件及覆盖范围</text></g><g class="flow-node" data-node="library" aria-label="Obsidian 阅读库"><title>后台增量同步或主动导入后，保存原件、各版本正文、阅读进度、批注和索引；AI输出与原文分别保存。</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="431" fill="#356495" font-size="17" font-weight="650">Obsidian 阅读库</text><text x="474" y="459" fill="#4d6069" font-size="12.8">你设置的库内相对目录</text></g><g class="flow-node" data-node="today" aria-label="来讯 · 订阅更新"><title>当天清单默认50分钟、最多3篇，不限制全部订阅。规则清单无需模型，AI精选与短导读需另行生成，自动 AI 精选默认关闭。</title><rect x="60" y="540" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="559" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="575" fill="#216957" font-size="17" font-weight="650">来讯 · 订阅更新</text><text x="79" y="603" fill="#4d6069" font-size="12.8">按作者发布日期，可选今日阅读</text></g><g class="flow-node" data-node="history" aria-label="拾遗 · 历史精选"><title>全历史未读轮换，与当天探索去重。非空日清单保存后固定，已读或删除退出，当天不补位。</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="575" fill="#216957" font-size="17" font-weight="650">拾遗 · 历史精选</text><text x="474" y="603" fill="#4d6069" font-size="12.8">默认每天2项，不调用模型</text></g><g class="flow-node" data-node="shelf" aria-label="藏卷 · 我的材料"><title>所有已收录材料集中管理。回收站保留正文、原件和版本，后续同步不会把删除内容自动加回。</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="575" fill="#9a6119" font-size="17" font-weight="650">藏卷 · 我的材料</text><text x="869" y="603" fill="#4d6069" font-size="12.8">检索 · 状态筛选 · 批量管理</text></g><g class="flow-node" data-node="read" aria-label="你阅读、观看、批注、判断"><title>推荐、已读和短导读都不会自动授权知识加工。探索卡片也可直接打开原链接观看或阅读。</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="719" fill="#9a6119" font-size="17" font-weight="650">你阅读、观看、批注、判断</text><text x="474" y="747" fill="#4d6069" font-size="12.8">可随时结束，也可选择深入处理</text></g><g class="flow-node" data-node="end" aria-label="只阅读，到此完成"><title>阅读和观看本身就是完整使用，不要求每篇都进入知识库。</title><rect x="60" y="828" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="847" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="863" fill="#9a6119" font-size="17" font-weight="650">只阅读，到此完成</text><text x="79" y="891" fill="#4d6069" font-size="12.8">阅读进度与批注保留</text></g><g class="flow-node" data-node="handoff" aria-label="选择指定材料交给 Claudian"><title>续思提供接续入口。只处理你明确选入的材料；先校验正文与原件，视频需要实际文字稿。</title><rect x="455" y="828" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="847" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="863" fill="#9a6119" font-size="17" font-weight="650">选择指定材料交给 Claudian</text><text x="474" y="891" fill="#4d6069" font-size="12.8">保存版本、原件、会话及队列</text></g><g class="flow-node" data-node="raw" aria-label="Claudian 按正式 RAW 协议加工"><title>工作台准备交接与观察进度，Claudian使用当前选定知识模型调用正式fanos-raw流程。接口验证不等于加工完成。</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="1007" fill="#70529a" font-size="17" font-weight="650">Claudian 按正式 RAW 协议加工</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">核验原件 → 登记 RAW → 提炼整合</text></g><g class="flow-node" data-node="dialogue" aria-label="先讨论，再明确归纳"><title>交付讨论底稿后，你继续交流，再明确要求“归纳并写入当前Wiki”。</title><rect x="60" y="1116" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="1135" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="1151" fill="#9a6119" font-size="17" font-weight="650">先讨论，再明确归纳</text><text x="79" y="1179" fill="#4d6069" font-size="12.8">默认路径：提问、修正、确认</text></g><g class="flow-node" data-node="direct" aria-label="直接写入 Wiki"><title>这是对指定材料在08内客观整理及最终归纳的明确授权，不混入个人批注或聊天想法。</title><rect x="850" y="1116" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="1135" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1151" fill="#9a6119" font-size="17" font-weight="650">直接写入 Wiki</text><text x="869" y="1179" fill="#4d6069" font-size="12.8">明确点击后，跳过讨论</text></g><g class="flow-node" data-node="wiki" aria-label="08_LLM Wiki · 完成归纳"><title>依据当前run正式事件、原件哈希、材料版本和实际文件核验。历史成功或回答文字不能代替本次产物。</title><rect x="455" y="1260" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="1279" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1295" fill="#356495" font-size="17" font-weight="650">08_LLM Wiki · 完成归纳</text><text x="474" y="1323" fill="#4d6069" font-size="12.8">主题页 + 来源档案 + 地图 + 回执</text></g><g class="flow-node" data-node="fanos" aria-label="另行授权后晋升 fanOS"><title>只有明确目标和具体改动获授权后才晋升。Wiki完成与fanOS晋升分别核对；周期维护尚未启用。</title><rect x="455" y="1404" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="1423" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1439" fill="#9a6119" font-size="17" font-weight="650">另行授权后晋升 fanOS</text><text x="474" y="1467" fill="#4d6069" font-size="12.8">明确目标笔记 / 看板 → 写入并回填</text></g></svg>