<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1408" role="img" aria-label="知识沉淀" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1406" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">知识沉淀</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">正文与原件足够</text><path d="M 610 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">缺口 / 冲突</text><path d="M 1005 488 V 511 H 1210 V 298 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1197" y="393.0" transform="rotate(-90 1197 393.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">补齐后</text><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 215 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 1005 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="939.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">明确要求归纳</text><path d="M 1005 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="939.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">已明确选择直达</text><path d="M 610 1064 V 1090.0 H 610 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="1227.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">另外授权目标</text><g class="flow-node" data-node="choose" aria-label="明确选中一份材料及版本"><title>来自来讯、远眺、拾遗、藏卷或手动导入。允许只读；必须明确选择才进入加工。</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="143" fill="#9a6119" font-size="17" font-weight="650">明确选中一份材料及版本</text><text x="474" y="171" fill="#4d6069" font-size="12.8">讨论，或直接写入 Wiki</text></g><g class="flow-node" data-node="check" aria-label="检查实际正文、原件与覆盖"><title>原件和正文快照按哈希保护。短导读或推荐摘要不能当全文，正文快照排除AI导读。</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="287" fill="#a65353" font-size="17" font-weight="650">检查实际正文、原件与覆盖</text><text x="474" y="315" fill="#4d6069" font-size="12.8">视频先取得字幕，PDF保留原件</text></g><g class="flow-node" data-node="missing" aria-label="不足或冲突，先补齐 / 核对"><title>无字幕或受限视频需要外部文字稿；扫描PDF需外部OCR/转换。用户修改和原件冲突不被覆盖。</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="431" fill="#9a6119" font-size="17" font-weight="650">不足或冲突，先补齐 / 核对</text><text x="869" y="459" fill="#4d6069" font-size="12.8">公开字幕失败可自行导入字幕</text></g><g class="flow-node" data-node="queue" aria-label="保存接续笔记、冻结快照与队列"><title>队列按材料身份与版本保存。多篇串行，等待当前RAW任务结束，也保护其他聊天的文字/图片草稿及正在接收的回复。</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="431" fill="#356495" font-size="17" font-weight="650">保存接续笔记、冻结快照与队列</text><text x="474" y="459" fill="#4d6069" font-size="12.8">绑定会话，保存首次讨论/直达选择</text></g><g class="flow-node" data-node="bridge" aria-label="验证接口并保存提交意图"><title>内置历史实测2.3.17；其他版本要验证当前版本与适配契约。验证不发模型请求；发送结果未知不重发。</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="575" fill="#a65353" font-size="17" font-weight="650">验证接口并保存提交意图</text><text x="474" y="603" fill="#4d6069" font-size="12.8">验证回执成功保存后才放行</text></g><g class="flow-node" data-node="raw" aria-label="Claudian 按 Vault 正式协议加工"><title>遵循当前Vault的fanos-raw真源，使用Claudian当前知识模型。工作台轻处理模型与此链路分开，不由工作台伪造登记。</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="719" fill="#70529a" font-size="17" font-weight="650">Claudian 按 Vault 正式协议加工</text><text x="474" y="747" fill="#4d6069" font-size="12.8">复制并核验原件 → RAW登记 → 提炼</text></g><g class="flow-node" data-node="discussion" aria-label="默认：等待讨论"><title>讨论后明确说“归纳并写入当前Wiki”；阅读完成或同意某句话不能代替最终归纳授权。</title><rect x="60" y="828" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="847" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="863" fill="#9a6119" font-size="17" font-weight="650">默认：等待讨论</text><text x="79" y="891" fill="#4d6069" font-size="12.8">交付底稿 → 提问、修正、补充</text></g><g class="flow-node" data-node="direct" aria-label="直达：跳过讨论"><title>点击直达即授权在08内完成归纳。优先整合已有主题，不掺入个人批注，不把作者主张当成已验证事实。</title><rect x="850" y="828" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="847" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="863" fill="#9a6119" font-size="17" font-weight="650">直达：跳过讨论</text><text x="869" y="891" fill="#4d6069" font-size="12.8">按原文客观整理指定材料</text></g><g class="flow-node" data-node="wiki" aria-label="实际写入 08_LLM Wiki"><title>由Claudian保存产物和finalize事件。原件或版本不匹配、用户修改冲突时先停止报告。</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1007" fill="#356495" font-size="17" font-weight="650">实际写入 08_LLM Wiki</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">主题知识、来源档案、地图及正式回执</text></g><g class="flow-node" data-node="observe" aria-label="续思核对当前任务结果"><title>RAW已登记、等待讨论、Wiki已归纳、fanOS已晋升分别显示。旧run成功不能覆盖新失败；仅发送不代表处理成功。</title><rect x="455" y="1116" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="1135" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="1151" fill="#a65353" font-size="17" font-weight="650">续思核对当前任务结果</text><text x="474" y="1179" fill="#4d6069" font-size="12.8">当前run + 同版本 + 哈希 + 实际文件</text></g><g class="flow-node" data-node="fanos" aria-label="另行授权具体目标后晋升 fanOS"><title>晋升需明确目标和改动，校验写后哈希及来源/Wiki/看板回链；目标后续被编辑则保留并提示核对。</title><rect x="455" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1295" fill="#9a6119" font-size="17" font-weight="650">另行授权具体目标后晋升 fanOS</text><text x="474" y="1323" fill="#4d6069" font-size="12.8">目标笔记 / 看板 → 写入 → 回链核验</text></g></svg>