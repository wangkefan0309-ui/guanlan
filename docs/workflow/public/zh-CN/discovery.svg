<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1552" role="img" aria-label="兴趣探索" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1550" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">兴趣探索</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 215 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 610 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">达标后</text><path d="M 610 776 V 802.0 H 1005 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">不达标 / 无候选</text><path d="M 610 920 V 946.0 H 215 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 920 V 946.0 H 1005 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 610 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 215 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 1005 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 1352 V 1378.0 H 610 V 1404" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1352 V 1378.0 H 610 V 1404" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 1352 V 1378.0 H 610 V 1404" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><g class="flow-node" data-node="trigger" aria-label="远眺 · 发现新内容"><title>插件启动、工作台打开、每小时、窗口恢复时检查当天批次；恢复只处理当日，不补跑停机期间每一天。</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="143" fill="#9a6119" font-size="17" font-weight="650">远眺 · 发现新内容</text><text x="474" y="171" fill="#4d6069" font-size="12.8">自动开启，也可手动发起</text></g><g class="flow-node" data-node="day" aria-label="检查当日回执，先保存历史引用"><title>新的探索先准备当天历史精选，再排除其链接；历史保存失败先报错。已存在日批次复用，不因升级重新计费。</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="287" fill="#a65353" font-size="17" font-weight="650">检查当日回执，先保存历史引用</text><text x="474" y="315" fill="#4d6069" font-size="12.8">已完成 / 失败 / 未知，不重发</text></g><g class="flow-node" data-node="web" aria-label="网页发现"><title>可选 DeepSeek 原生联网、无需检索 Key 的 Hacker News/GitHub 公开检索，或自行配置 Tavily。公开检索偏技术主题。</title><rect x="60" y="396" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="60" y="415" width="4" height="54" rx="2" fill="#70529a"/><text x="79" y="431" fill="#70529a" font-size="17" font-weight="650">网页发现</text><text x="79" y="459" fill="#4d6069" font-size="12.8">DeepSeek联网 / 公开检索 / Tavily</text></g><g class="flow-node" data-node="x" aria-label="可选免费 X"><title>最多3个Top首页，每页最多20帖，不翻页。失败或未知停止当天后续请求，不自动转付费SocialData。</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="431" fill="#216957" font-size="17" font-weight="650">可选免费 X</text><text x="474" y="459" fill="#4d6069" font-size="12.8">自己的账号，共享日缓存</text></g><g class="flow-node" data-node="subs" aria-label="近期订阅正文补充"><title>使用已经保存的实际正文，明确标注订阅补充；排除已读、拒绝和近期推过的链接。</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="869" y="431" fill="#216957" font-size="17" font-weight="650">近期订阅正文补充</text><text x="869" y="459" fill="#4d6069" font-size="12.8">近7天未读 / 稍后读，最多6项</text></g><g class="flow-node" data-node="evidence" aria-label="合并候选、预筛与有限补证"><title>网页最多核对6页，X每批最多补读3条实际外链。帖文、外链摘选和视频内容分别标记。</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="575" fill="#216957" font-size="17" font-weight="650">合并候选、预筛与有限补证</text><text x="474" y="603" fill="#4d6069" font-size="12.8">最多24候选，证据与缺口分开</text></g><g class="flow-node" data-node="score" aria-label="轻处理模型筛选 + 程序校验"><title>还须具体增量或用途、证据足够且已评份量合格。未知作品份量留空；不把分数当真实性概率。原生联网与筛选分别计用量。</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="719" fill="#70529a" font-size="17" font-weight="650">轻处理模型筛选 + 程序校验</text><text x="474" y="747" fill="#4d6069" font-size="12.8">PASS · 价值≥60 · 相关性≥6</text></g><g class="flow-node" data-node="zero" aria-label="不够则如实少推或零推荐"><title>不降门槛凑数，不把只有标题、互动量或未看视频当作已评价全文。</title><rect x="850" y="828" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="850" y="847" width="4" height="54" rx="2" fill="#a65353"/><text x="869" y="863" fill="#a65353" font-size="17" font-weight="650">不够则如实少推或零推荐</text><text x="869" y="891" fill="#4d6069" font-size="12.8">保留排除原因与失败回执</text></g><g class="flow-node" data-node="picks" aria-label="远眺 · 目标每天1～3条"><title>与当天历史精选去重，并排除已读、回收站、拒绝及30天内推荐链接；推荐生成日期与内容日期分开。</title><rect x="455" y="828" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="847" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="863" fill="#70529a" font-size="17" font-weight="650">远眺 · 目标每天1～3条</text><text x="474" y="891" fill="#4d6069" font-size="12.8">事件去重、板块与作者搭配</text></g><g class="flow-node" data-node="open" aria-label="直接打开原文 / 观看"><title>仅打开外链不代表已经取得正文或字幕；可以只读不收录。</title><rect x="60" y="972" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="991" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="1007" fill="#9a6119" font-size="17" font-weight="650">直接打开原文 / 观看</text><text x="79" y="1035" fill="#4d6069" font-size="12.8">无需先收录</text></g><g class="flow-node" data-node="collect" aria-label="选择收录正文或取得文字稿"><title>X收录保存本条完整文字与原始对象，不包含回复、视频转写或外链全文；文章走普通导入。</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1007" fill="#9a6119" font-size="17" font-weight="650">选择收录正文或取得文字稿</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">已有订阅正文直接复用</text></g><g class="flow-node" data-node="reject" aria-label="拒绝该推荐"><title>反馈进入去重排除，不重新生成当天推荐或改写历史评分。</title><rect x="850" y="972" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="991" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1007" fill="#9a6119" font-size="17" font-weight="650">拒绝该推荐</text><text x="869" y="1035" fill="#4d6069" font-size="12.8">后续探索排除对应链接</text></g><g class="flow-node" data-node="readlib" aria-label="进入同一阅读库"><title>重复收录去重，版本独立，原有批注和位置保留；不把AI摘要合并成来源正文。</title><rect x="455" y="1116" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="1135" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1151" fill="#356495" font-size="17" font-weight="650">进入同一阅读库</text><text x="474" y="1179" fill="#4d6069" font-size="12.8">原件、正文、进度与批注</text></g><g class="flow-node" data-node="today" aria-label="来讯 · 今日阅读"><title>规则清单无需模型；可手动生成AI精选与短导读，默认每天一批、最多12篇，每篇前2400字符。自动 AI 精选默认关闭。</title><rect x="60" y="1260" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="1279" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="1295" fill="#216957" font-size="17" font-weight="650">来讯 · 今日阅读</text><text x="79" y="1323" fill="#4d6069" font-size="12.8">默认50分钟 / 最多3篇</text></g><g class="flow-node" data-node="history" aria-label="拾遗 · 历史精选"><title>无需新模型调用；未读至少7天、稍后读14天再推。日清单固定，已读或删除不补位。</title><rect x="455" y="1260" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="1279" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="1295" fill="#216957" font-size="17" font-weight="650">拾遗 · 历史精选</text><text x="474" y="1323" fill="#4d6069" font-size="12.8">默认2项，全历史未读轮换</text></g><g class="flow-node" data-node="shelf" aria-label="藏卷 · 检索与批量管理"><title>回收站保留原文件及各版本；删除状态阻止同步复活。未保存的阅读草稿会阻止批量改动。</title><rect x="850" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1295" fill="#9a6119" font-size="17" font-weight="650">藏卷 · 检索与批量管理</text><text x="869" y="1323" fill="#4d6069" font-size="12.8">未读 / 阅读中 / 稍后读 / 已读</text></g><g class="flow-node" data-node="read" aria-label="阅读、批注、保存进度"><title>推荐不会自动标已读，已读不会自动写Wiki。阅读时可继续选入知识加工。</title><rect x="455" y="1404" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="1423" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1439" fill="#9a6119" font-size="17" font-weight="650">阅读、批注、保存进度</text><text x="474" y="1467" fill="#4d6069" font-size="12.8">只阅读，或选择进入续思</text></g></svg>