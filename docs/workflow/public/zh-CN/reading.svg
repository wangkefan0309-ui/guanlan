<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1264" role="img" aria-label="阅读与精选" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1262" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">阅读与精选</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 215 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 488 V 514.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="215.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">你选择AI时</text><path d="M 215 488 V 511 H 20 V 1018 H 455" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="33" y="753.0" transform="rotate(-90 33 753.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">直接阅读，无需模型</text><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1005.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">选择删除</text><path d="M 1005 488 V 511 H 1210 V 1018 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1197" y="753.0" transform="rotate(-90 1197 753.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">阅读 / 改状态</text><path d="M 1005 632 V 658.0 H 1005 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 765 586 H 803 V 1018 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="790" y="802.0" transform="rotate(-90 790 802.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">打开原版本</text><path d="M 215 632 V 658.0 H 215 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 776 V 802.0 H 215 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 776 V 874.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 215 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 1005 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><g class="flow-node" data-node="library" aria-label="同一阅读库与索引"><title>三个阅读入口复用同一ReadingLibrary，使用真实文件和索引，不重复复制正文。</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="143" fill="#356495" font-size="17" font-weight="650">同一阅读库与索引</text><text x="474" y="171" fill="#4d6069" font-size="12.8">当前材料、各版本、阅读状态与批注</text></g><g class="flow-node" data-node="today" aria-label="来讯 · 今日阅读候选"><title>按作者真实发布日期归档，排除已读、稍后读、纯元数据和验证用途；阅读中优先。AI资讯/热点过旧时不自动精选。</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="287" fill="#216957" font-size="17" font-weight="650">来讯 · 今日阅读候选</text><text x="79" y="315" fill="#4d6069" font-size="12.8">当天订阅正文，不限制全部来讯</text></g><g class="flow-node" data-node="old" aria-label="拾遗 · 全历史候选"><title>不限近7天。日期未知时按本地保存边界判断历史，不补造作者日期。视频有可打开原链接也可选，但明确没有文字稿。</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="287" fill="#216957" font-size="17" font-weight="650">拾遗 · 全历史候选</text><text x="474" y="315" fill="#4d6069" font-size="12.8">当天之前的历史未读材料</text></g><g class="flow-node" data-node="all" aria-label="藏卷 · 全部已收录材料"><title>按未读、阅读中、稍后读、已读查看，也可从日期页回看历史；批量选择覆盖筛选结果的全部分页。</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="287" fill="#9a6119" font-size="17" font-weight="650">藏卷 · 全部已收录材料</text><text x="869" y="315" fill="#4d6069" font-size="12.8">跨日检索与阅读状态筛选</text></g><g class="flow-node" data-node="rule" aria-label="规则生成今日清单"><title>预算按阅读速度估算，默认每分钟450字；板块搭配、在读优先。保存清单采用比较写入，用户修改保留并提示。</title><rect x="60" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="431" fill="#216957" font-size="17" font-weight="650">规则生成今日清单</text><text x="79" y="459" fill="#4d6069" font-size="12.8">默认50分钟 / 最多3篇</text></g><g class="flow-node" data-node="rotate" aria-label="价值 + 积压轮换"><title>先照顾少推荐的材料，兼顾优先级、在读、正向评价和最早积压；未读至少7天、稍后读至少14天再推。</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="431" fill="#216957" font-size="17" font-weight="650">价值 + 积压轮换</text><text x="474" y="459" fill="#4d6069" font-size="12.8">默认每天2项，可设1～5项</text></g><g class="flow-node" data-node="manage" aria-label="批量状态与回收站操作"><title>已读、未读、稍后读按文章更新，原件和批注不改；删除同一文章全部版本，仅移入索引回收站。</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="431" fill="#9a6119" font-size="17" font-weight="650">批量状态与回收站操作</text><text x="869" y="459" fill="#4d6069" font-size="12.8">保留阅读位置，草稿未存先拦截</text></g><g class="flow-node" data-node="ai" aria-label="可选：生成 AI 精选与导读"><title>只做轻处理，使用设置中的模型连接。每天默认1批；同批复用，失败或未知也计限额，不能通过重试重发。</title><rect x="60" y="540" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="559" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="575" fill="#9a6119" font-size="17" font-weight="650">可选：生成 AI 精选与导读</text><text x="79" y="603" fill="#4d6069" font-size="12.8">自动模式默认关闭，可手动生成</text></g><g class="flow-node" data-node="refs" aria-label="保存当天固定版本引用"><title>不复制正文、不调用模型；非空清单提交后固定。已读或删除退出，当天不补位；后来出现新版本不替换旧引用。</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="575" fill="#356495" font-size="17" font-weight="650">保存当天固定版本引用</text><text x="474" y="603" fill="#4d6069" font-size="12.8">与当天探索按规范化链接去重</text></g><g class="flow-node" data-node="trash" aria-label="可恢复删除"><title>删除仅影响本阅读库，不改共享后台材料账本。同步跳过同一来源身份，不会自动复活；已有知识任务不被撤销。</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#356495"/><text x="869" y="575" fill="#356495" font-size="17" font-weight="650">可恢复删除</text><text x="869" y="603" fill="#4d6069" font-size="12.8">正文、原件、版本仍保留</text></g><g class="flow-node" data-node="review" aria-label="摘选输入 → 模型 → 校验"><title>编号原文证据最多8段，程序按编号回取原文。输出PASS/BLOCK/UNKNOWN；PASS且≥40分参与AI排序，未评估项继续规则排序。不能把摘选评价当全文精读。</title><rect x="60" y="684" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="60" y="703" width="4" height="54" rx="2" fill="#70529a"/><text x="79" y="719" fill="#70529a" font-size="17" font-weight="650">摘选输入 → 模型 → 校验</text><text x="79" y="747" fill="#4d6069" font-size="12.8">最多12篇，每篇前2400字符</text></g><g class="flow-node" data-node="restore" aria-label="恢复原材料及全部版本"><title>恢复后继续按原材料身份和版本去重；不会重跑探索或知识模型，也不等于重新授权Wiki加工。</title><rect x="850" y="684" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="703" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="719" fill="#9a6119" font-size="17" font-weight="650">恢复原材料及全部版本</text><text x="869" y="747" fill="#4d6069" font-size="12.8">沿用原路径、批注、状态与位置</text></g><g class="flow-node" data-node="guide" aria-label="独立保存导读、证据与用量"><title>导读位于AI导读目录，原回答无效时保存到模型回执，不当作有效导读。保存失败只补存首次结果；原文与AI内容分别保留。</title><rect x="60" y="828" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="60" y="847" width="4" height="54" rx="2" fill="#356495"/><text x="79" y="863" fill="#356495" font-size="17" font-weight="650">独立保存导读、证据与用量</text><text x="79" y="891" fill="#4d6069" font-size="12.8">再更新回执索引和清单</text></g><g class="flow-node" data-node="read" aria-label="阅读 / 观看 / 批注 / 保存位置"><title>不会因为推荐一次就标已读。未保存的正文修改要先处理，批量状态和知识队列保护草稿。</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1007" fill="#9a6119" font-size="17" font-weight="650">阅读 / 观看 / 批注 / 保存位置</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">可以直接读原文，也可看短导读</text></g><g class="flow-node" data-node="finish" aria-label="阅读完成即可结束"><title>只阅读观看也是完整使用。工作台不因已读或赞同一句话自动生成Wiki。</title><rect x="60" y="1116" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="1135" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="1151" fill="#9a6119" font-size="17" font-weight="650">阅读完成即可结束</text><text x="79" y="1179" fill="#4d6069" font-size="12.8">不强制沉淀每篇材料</text></g><g class="flow-node" data-node="continue" aria-label="明确选入知识加工"><title>从材料详情或推荐卡片进入续思，使用指定版本、实际正文与原件；先补足证据，再调用Claudian。</title><rect x="850" y="1116" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="1135" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1151" fill="#9a6119" font-size="17" font-weight="650">明确选入知识加工</text><text x="869" y="1179" fill="#4d6069" font-size="12.8">讨论后归纳 / 直接写入Wiki</text></g></svg>