<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 976" role="img" aria-label="恢复与维护" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="974" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">恢复与维护</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 215 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 215 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 488 V 514.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="215.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">恢复后</text><path d="M 215 632 V 658.0 H 215 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="219.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">拿到首次结果</text><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">如果结果实际未知</text><path d="M 765 298 H 803 V 586 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="790" y="442.0" transform="rotate(-90 790 442.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">保存冲突</text><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 632 V 658.0 H 1005 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 776 V 802.0 H 1005 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1005.0" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">回读核验成功后</text><g class="flow-node" data-node="net" aria-label="采集 / 同步出现问题"><title>不因一次网络错误例行重配订阅或密钥，先看错误类型、重试时间和来源检查记录。</title><rect x="60" y="108" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="60" y="127" width="4" height="54" rx="2" fill="#a65353"/><text x="79" y="143" fill="#a65353" font-size="17" font-weight="650">采集 / 同步出现问题</text><text x="79" y="171" fill="#4d6069" font-size="12.8">保留已有材料、进度和失败历史</text></g><g class="flow-node" data-node="model" aria-label="模型 / 知识任务发起"><title>每日AI、探索和知识发送分别记录首次任务，保留原始模型配置、结果与用量。</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="143" fill="#356495" font-size="17" font-weight="650">模型 / 知识任务发起</text><text x="474" y="171" fill="#4d6069" font-size="12.8">先持久化批次或提交意图</text></g><g class="flow-node" data-node="release" aria-label="维护者准备更新"><title>代码变更执行适用检查；真实材料库不导入合成测试材料。插件与后台分别核验旧版本及更新结果。</title><rect x="850" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="143" fill="#9a6119" font-size="17" font-weight="650">维护者准备更新</text><text x="869" y="171" fill="#4d6069" font-size="12.8">隔离修复、检查、构建、签名</text></g><g class="flow-node" data-node="classify" aria-label="分类处理"><title>网络恢复只提前处理符合条件的网络来源；授权与限流不能因网络恢复而绕过。</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#a65353"/><text x="79" y="287" fill="#a65353" font-size="17" font-weight="650">分类处理</text><text x="79" y="315" fill="#4d6069" font-size="12.8">网络 / 授权 / 限流 / 存储</text></g><g class="flow-node" data-node="result" aria-label="核对首次结果与保存状态"><title>已拿到首次结果时先保存日志与回执，再保存导读、推荐和索引。没有最终结果则保留未知；已有结果保存失败只补存，不再次调用模型。</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="287" fill="#a65353" font-size="17" font-weight="650">核对首次结果与保存状态</text><text x="474" y="315" fill="#4d6069" font-size="12.8">已有结果补存，未知停止重发</text></g><g class="flow-node" data-node="backup" aria-label="核验旧后台并正常停服"><title>只停止核实身份的自有进程。完整备份包含当前分段材料账本与索引，不拿旧ledger.json代替。</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="287" fill="#9a6119" font-size="17" font-weight="650">核验旧后台并正常停服</text><text x="869" y="315" fill="#4d6069" font-size="12.8">完整备份后升级</text></g><g class="flow-node" data-node="backoff" aria-label="按类型退避重试"><title>暂时验证页或正文暂缺等失败可退避至1小时；其他错误按各自策略。排定时间不保证上游已恢复。</title><rect x="60" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="431" fill="#216957" font-size="17" font-weight="650">按类型退避重试</text><text x="79" y="459" fill="#4d6069" font-size="12.8">网络：1 / 2 / 5 / 10 / 15分钟</text></g><g class="flow-node" data-node="unknown" aria-label="超时 / 仅started / 发送未知"><title>保留原记录，等待明确结果或核对已有产物；未知结果不能通过重建批次来规避限制。</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="431" fill="#a65353" font-size="17" font-weight="650">超时 / 仅started / 发送未知</text><text x="474" y="459" fill="#4d6069" font-size="12.8">不自动重发</text></g><g class="flow-node" data-node="upgrade" aria-label="后台升级并核验数据"><title>程序升级、后台启动、材料保留和通道准备分别核验。升级成功不表示旧备份已云端归档。</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="431" fill="#9a6119" font-size="17" font-weight="650">后台升级并核验数据</text><text x="869" y="459" fill="#4d6069" font-size="12.8">成功后准备本机签名更新通道</text></g><g class="flow-node" data-node="catchup" aria-label="恢复后按窗口补收"><title>需要已启用延迟补收，且不早于开始使用日；停机不保证全量补齐。原件与正文成功后才能记材料成功。</title><rect x="60" y="540" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="559" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="575" fill="#216957" font-size="17" font-weight="650">恢复后按窗口补收</text><text x="79" y="603" fill="#4d6069" font-size="12.8">最多前7天，依赖上游仍可读</text></g><g class="flow-node" data-node="conflict" aria-label="文件被改或产物不匹配"><title>正文版本独立；已登记批注可保留并报告，原件缺失/哈希失败或写入失败需先处理。</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="575" fill="#a65353" font-size="17" font-weight="650">文件被改或产物不匹配</text><text x="474" y="603" fill="#4d6069" font-size="12.8">保留用户内容，报告冲突</text></g><g class="flow-node" data-node="install" aria-label="插件检查后手动一键更新"><title>只替换自身4个程序文件；当前data.json与材料保留。事务失败按条件恢复，外部修改不强制覆盖。</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="575" fill="#9a6119" font-size="17" font-weight="650">插件检查后手动一键更新</text><text x="869" y="603" fill="#4d6069" font-size="12.8">签名、哈希、任务与草稿检查</text></g><g class="flow-node" data-node="commit" aria-label="重新同步并提交检查点"><title>原件缺失、哈希错误、实际写入失败继续阻止游标；已有批注保护不阻止独立新材料保存。</title><rect x="60" y="684" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="60" y="703" width="4" height="54" rx="2" fill="#356495"/><text x="79" y="719" fill="#356495" font-size="17" font-weight="650">重新同步并提交检查点</text><text x="79" y="747" fill="#4d6069" font-size="12.8">整页成功后推进游标</text></g><g class="flow-node" data-node="resume" aria-label="恢复首次结果或原知识会话"><title>已落盘首次结果可补存。知识会话显式恢复首轮只读，不默默重发旧任务。</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="719" fill="#9a6119" font-size="17" font-weight="650">恢复首次结果或原知识会话</text><text x="474" y="747" fill="#4d6069" font-size="12.8">只在真实回执与文件匹配时恢复</text></g><g class="flow-node" data-node="cloud" aria-label="历史后台快照加密归档"><title>云端依赖附件全部保留，密码独立保管。失败时保留本地未核验副本；不涉及当前运行数据清理。</title><rect x="850" y="684" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="703" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="719" fill="#9a6119" font-size="17" font-weight="650">历史后台快照加密归档</text><text x="869" y="747" fill="#4d6069" font-size="12.8">私有云上传 → 回读 → 逐文件核验</text></g><g class="flow-node" data-node="retention" aria-label="核验通过后轮换旧副本"><title>云端回读和逐文件核验通过后，本机历史后台快照保留两个不同版本各最新一份。云端依赖单独保留，活跃运行数据和 Vault 在该规则范围之外。</title><rect x="850" y="828" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="850" y="847" width="4" height="54" rx="2" fill="#a65353"/><text x="869" y="863" fill="#a65353" font-size="17" font-weight="650">核验通过后轮换旧副本</text><text x="869" y="891" fill="#4d6069" font-size="12.8">目标：两个不同版本各最新一份</text></g></svg>