<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1264" role="img" aria-label="订阅采集" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1262" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">订阅采集</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">核验通过</text><path d="M 610 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">未通过</text><path d="M 1005 632 V 655 H 1210 V 442 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1197" y="537.0" transform="rotate(-90 1197 537.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">按条件再检查</text><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 610 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 610 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><g class="flow-node" data-node="settings" aria-label="信源 · 添加或管理订阅"><title>来源行启停立即保存；分类和间隔等弹窗设置需显式保存。关闭来源中止后续抓取，已收录材料保留。</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="143" fill="#9a6119" font-size="17" font-weight="650">信源 · 添加或管理订阅</text><text x="474" y="171" fill="#4d6069" font-size="12.8">识别地址 → 分类 / 间隔 / 启停</text></g><g class="flow-node" data-node="wx" aria-label="公众号 / 普通RSS"><title>公众号核对账号、作者发布日期和正文；普通RSS/Atom保留feed正文，必要时回源。私密RSS只留本机。</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="287" fill="#216957" font-size="17" font-weight="650">公众号 / 普通RSS</text><text x="79" y="315" fill="#4d6069" font-size="12.8">公众号全文RSS + 原页核验</text></g><g class="flow-node" data-node="yt" aria-label="YouTube"><title>配置并验证自己的 Key 后优先调用官方接口，失败时尝试频道 Atom 和同频道公开页。列表返回的是视频元数据。获取字幕走独立流程。</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="287" fill="#216957" font-size="17" font-weight="650">YouTube</text><text x="474" y="315" fill="#4d6069" font-size="12.8">官方 Data API → Atom → 公开主页</text></g><g class="flow-node" data-node="bili" aria-label="B站"><title>核对UID与视频身份，保存元数据及观看链接；适配XML不会冒充官方RSS。</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="869" y="287" fill="#216957" font-size="17" font-weight="650">B站</text><text x="869" y="315" fill="#4d6069" font-size="12.8">本机 RSSHub，失败可浏览器回退</text></g><g class="flow-node" data-node="validate" aria-label="核对来源、日期与内容"><title>正常按来源间隔采集，默认每小时。公众号当天候选核验原页；日期未知或未来不能冒充今日发布。</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="431" fill="#a65353" font-size="17" font-weight="650">核对来源、日期与内容</text><text x="474" y="459" fill="#4d6069" font-size="12.8">条件读取，每6小时完整核对</text></g><g class="flow-node" data-node="save" aria-label="按身份与内容版本去重保存"><title>后台先保存单条材料，再提交索引与序号。失败不确认指纹；空feed成功与正文成功分别记账。</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="575" fill="#356495" font-size="17" font-weight="650">按身份与内容版本去重保存</text><text x="474" y="603" fill="#4d6069" font-size="12.8">原件 / 正文或视频元数据</text></g><g class="flow-node" data-node="retry" aria-label="失败分类并保留检查历史"><title>网络按1、2、5、10、15分钟重试；授权和限流遵守各自条件。恢复检查只提前处理符合条件的网络失败。</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#a65353"/><text x="869" y="575" fill="#a65353" font-size="17" font-weight="650">失败分类并保留检查历史</text><text x="869" y="603" fill="#4d6069" font-size="12.8">网络 / 授权 / 限流 / 存储</text></g><g class="flow-node" data-node="feed" aria-label="后台增量材料 feed"><title>逐条读取并核验哈希；后台保存与阅读库同步是两个步骤。旧ledger.json仅保留历史。</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="719" fill="#356495" font-size="17" font-weight="650">后台增量材料 feed</text><text x="474" y="747" fill="#4d6069" font-size="12.8">ledger-index.json + ledger-entries</text></g><g class="flow-node" data-node="sync" aria-label="插件同步已采集材料"><title>“检查并同步”发起到期来源及符合条件的网络故障来源检查，同时同步账本已有材料。等待本轮结束后再同步新增材料，最多跟踪三分钟，全程无需模型。</title><rect x="455" y="828" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="847" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="863" fill="#216957" font-size="17" font-weight="650">插件同步已采集材料</text><text x="474" y="891" fill="#4d6069" font-size="12.8">启动、打开工作台、按同步间隔</text></g><g class="flow-node" data-node="vault" aria-label="阅读库提交原件、正文与索引"><title>已登记正文批注保留并报告，独立新材料可继续同步；原件缺失、校验失败或写入失败继续阻止游标推进。</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1007" fill="#356495" font-size="17" font-weight="650">阅读库提交原件、正文与索引</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">整页成功后再推进同步游标</text></g><g class="flow-node" data-node="view" aria-label="来讯按作者日期展示"><title>有界延迟补收最多前7天，必须先启用，且依赖上游仍保留条目及原页可读。补收归原日期，不挤进今天。</title><rect x="455" y="1116" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="1135" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="1151" fill="#216957" font-size="17" font-weight="650">来讯按作者日期展示</text><text x="474" y="1179" fill="#4d6069" font-size="12.8">回看日期 / 跨日检索 / 阅读</text></g></svg>