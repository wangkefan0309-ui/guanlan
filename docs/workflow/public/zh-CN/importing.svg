<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1408" role="img" aria-label="导入与文字稿" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1406" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">导入与文字稿</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 215 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 488 V 514.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="215.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">普通文章</text><path d="M 215 488 V 502.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="495.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">X单帖返回</text><path d="M 610 488 V 526.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="519.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">HTML / PDF</text><path d="M 370 586 H 455" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">MD本地解析</text><path d="M 1005 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">取得文字</text><path d="M 1005 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1005.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">受限或缺失</text><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 215 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">已存在</text><path d="M 610 776 V 802.0 H 610 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">新版本</text><path d="M 610 776 V 802.0 H 1005 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">校验失败</text><path d="M 215 920 V 943 H 20 V 1162 H 455" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="33" y="1041.0" transform="rotate(-90 33 1041.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">复用</text><path d="M 610 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 610 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 215 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 1005 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><g class="flow-node" data-node="start" aria-label="添加材料 / 推荐卡片收录"><title>可选择仅导入、导入并交给Claudian、导入并直接写入Wiki；实际保存失败时不冒充后续任务已完成。</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="143" fill="#9a6119" font-size="17" font-weight="650">添加材料 / 推荐卡片收录</text><text x="474" y="171" fill="#4d6069" font-size="12.8">选择材料和导入后的处理方式</text></g><g class="flow-node" data-node="link" aria-label="文章链接 / X帖文"><title>普通文章请求公开原页；X收录复用已校验缓存，保存本条完整文字和原始接口对象，不包含回复、外链全文或视频转写。</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="287" fill="#9a6119" font-size="17" font-weight="650">文章链接 / X帖文</text><text x="79" y="315" fill="#4d6069" font-size="12.8">保留原始链接与来源身份</text></g><g class="flow-node" data-node="file" aria-label="MD / HTML / PDF"><title>同一材料更新复用identity，用内容哈希区分版本。同名不同材料需区分来源身份，不凭标题覆盖旧文件。</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="287" fill="#9a6119" font-size="17" font-weight="650">MD / HTML / PDF</text><text x="474" y="315" fill="#4d6069" font-size="12.8">稳定身份与原字节</text></g><g class="flow-node" data-node="video" aria-label="YouTube / B站 / SRT / VTT"><title>视频订阅和推荐元数据不是文字稿；公开视频字幕端点不写订阅feed。用户自有字幕可直接导入。</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="287" fill="#9a6119" font-size="17" font-weight="650">YouTube / B站 / SRT / VTT</text><text x="869" y="315" fill="#4d6069" font-size="12.8">取得视频文字稿，或导入自有字幕</text></g><g class="flow-node" data-node="fetch" aria-label="读取原页或本条缓存"><title>普通网页仅允许公网和标准端口，逐跳校验，不执行脚本或调用模型/MinerU。仅保留远程绝对图片地址，相对图片移除；保留HTML不等于完整离线页面。免费X原件缺失或哈希失败阻止收录。</title><rect x="60" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="431" fill="#216957" font-size="17" font-weight="650">读取原页或本条缓存</text><text x="79" y="459" fill="#4d6069" font-size="12.8">提取文字，保留原件和缺口</text></g><g class="flow-node" data-node="parse" aria-label="解析文件 / 附加PDF转换稿"><title>扫描PDF不会伪装成已OCR。MinerU等转换稿需外部取得后补充，当前不内置MinerU服务。</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="431" fill="#216957" font-size="17" font-weight="650">解析文件 / 附加PDF转换稿</text><text x="474" y="459" fill="#4d6069" font-size="12.8">原件保留，转换稿独立版本</text></g><g class="flow-node" data-node="transcript" aria-label="尝试公开字幕 / 解析字幕文件"><title>公开字幕标记partial，注明自动字幕和画面缺口。SRT/VTT保留原字节；逆序或零时长保留句子并提示待核对。</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="869" y="431" fill="#216957" font-size="17" font-weight="650">尝试公开字幕 / 解析字幕文件</text><text x="869" y="459" fill="#4d6069" font-size="12.8">保留时间定位与语言说明</text></g><g class="flow-node" data-node="material" aria-label="形成材料及覆盖说明"><title>来源原件、提取正文、AI生成内容始终分开；标题和推荐摘要不能替代缺失的实际内容。</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="575" fill="#a65353" font-size="17" font-weight="650">形成材料及覆盖说明</text><text x="474" y="603" fill="#4d6069" font-size="12.8">正文 / 部分文字 / 仅元数据</text></g><g class="flow-node" data-node="backend" aria-label="服务导入先写后台账本"><title>POST /v1/import成功会先登记后台材料账本，再返回Material，不创建订阅。插件收到返回后直接保存阅读库；外部HTTP客户端导入后需同步已采集材料。插件本地解析的MD/SRT/VTT、视频字幕和X单帖返回不走这一步。</title><rect x="60" y="540" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="60" y="559" width="4" height="54" rx="2" fill="#356495"/><text x="79" y="575" fill="#356495" font-size="17" font-weight="650">服务导入先写后台账本</text><text x="79" y="603" fill="#4d6069" font-size="12.8">普通链接 / HTML / PDF 的导入请求</text></g><g class="flow-node" data-node="missing" aria-label="正文不足或字幕受限"><title>登录限制、无公开字幕、X/其他平台视频或额外分P需要外部文字稿。没有自动下载音视频或启用付费ASR。</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="575" fill="#9a6119" font-size="17" font-weight="650">正文不足或字幕受限</text><text x="869" y="603" fill="#4d6069" font-size="12.8">可先读链接，知识加工前补齐</text></g><g class="flow-node" data-node="identity" aria-label="核对材料身份与内容版本"><title>材料ID来自来源身份，版本哈希包含正文、覆盖等内容；板块、采集时间和AI导读不制造新正文版本。</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="719" fill="#a65353" font-size="17" font-weight="650">核对材料身份与内容版本</text><text x="474" y="747" fill="#4d6069" font-size="12.8">规范化URL / 稳定文件identity</text></g><g class="flow-node" data-node="same" aria-label="同身份、同版本"><title>不重复创建正文版本，保留首次保存的材料信息、阅读位置和批注；已有回收站记录要求先恢复。</title><rect x="60" y="828" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="847" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="863" fill="#216957" font-size="17" font-weight="650">同身份、同版本</text><text x="79" y="891" fill="#4d6069" font-size="12.8">复用首次材料与保存元数据</text></g><g class="flow-node" data-node="new" aria-label="新材料或新内容版本"><title>不会用新正文覆盖原版本；同一PDF的新转换稿也不能沿用旧转换稿的Wiki成功状态。</title><rect x="455" y="828" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="847" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="863" fill="#216957" font-size="17" font-weight="650">新材料或新内容版本</text><text x="474" y="891" fill="#4d6069" font-size="12.8">为正文版本分配独立路径</text></g><g class="flow-node" data-node="blocked" aria-label="原件 / 文件发生冲突"><title>原件缺失、哈希变化或非法路径不能被“重试导入”绕过；已登记正文批注保留并报告，按实际原因处理。</title><rect x="850" y="828" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="850" y="847" width="4" height="54" rx="2" fill="#a65353"/><text x="869" y="863" fill="#a65353" font-size="17" font-weight="650">原件 / 文件发生冲突</text><text x="869" y="891" fill="#4d6069" font-size="12.8">保留用户内容并报告</text></g><g class="flow-node" data-node="save" aria-label="恢复记录 → 原件 / 正文 → 索引"><title>先保存首次材料与原件的恢复记录，再落原件和正文，最后提交索引；重试补交同一结果，不强写用户改动。</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1007" fill="#356495" font-size="17" font-weight="650">恢复记录 → 原件 / 正文 → 索引</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">比较写入，失败保留恢复点</text></g><g class="flow-node" data-node="ready" aria-label="材料已保存到阅读库"><title>插件导入弹窗把返回材料直接保存到当前阅读库。/v1/import已先写后台账本；HTTP客户端需后续同步。视频文字稿、X单帖和插件本地解析的MD/SRT/VTT不因此进入后台feed；所有这些操作都不创建订阅。</title><rect x="455" y="1116" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="1135" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1151" fill="#356495" font-size="17" font-weight="650">材料已保存到阅读库</text><text x="474" y="1179" fill="#4d6069" font-size="12.8">阅读、批注、检索与后续接续</text></g><g class="flow-node" data-node="read" aria-label="仅导入阅读"><title>保存、阅读和观看不依赖Claudian可用，也不会自动正式登记RAW。</title><rect x="60" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="1295" fill="#9a6119" font-size="17" font-weight="650">仅导入阅读</text><text x="79" y="1323" fill="#4d6069" font-size="12.8">按自己的节奏阅读</text></g><g class="flow-node" data-node="discuss" aria-label="导入并讨论"><title>明确选择后，按当前版本冻结正文、准备接续笔记和队列；实际RAW由Claudian核验与登记。</title><rect x="455" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1295" fill="#9a6119" font-size="17" font-weight="650">导入并讨论</text><text x="474" y="1323" fill="#4d6069" font-size="12.8">进入知识队列，先交付底稿</text></g><g class="flow-node" data-node="direct" aria-label="导入并直接写入Wiki"><title>跳过讨论但保留来源、原件和正式核验；不因此授权写fanOS、Inbox或个人记忆。</title><rect x="850" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1295" fill="#9a6119" font-size="17" font-weight="650">导入并直接写入Wiki</text><text x="869" y="1323" fill="#4d6069" font-size="12.8">明确授权指定材料在08内归纳</text></g></svg>