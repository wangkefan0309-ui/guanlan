<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 976" role="img" aria-label="Recovery, updates, and backups" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="974" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">Recovery, updates, and backups</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 215 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 215 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 488 V 514.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="215.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Recovered</text><path d="M 215 632 V 658.0 H 215 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="219.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Have first response</text><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Outcome unknown</text><path d="M 765 298 H 803 V 586 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="790" y="442.0" transform="rotate(-90 790 442.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Write conflict</text><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 632 V 658.0 H 1005 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 776 V 802.0 H 1005 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1005.0" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Archive verified</text><g class="flow-node" data-node="net" aria-label="Collection or sync error"><title>Inspect the source receipt, type, and retry time. Change credentials when the error points to authorization.</title><rect x="60" y="108" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="60" y="127" width="4" height="54" rx="2" fill="#a65353"/><text x="79" y="143" fill="#a65353" font-size="17" font-weight="650">Collection or sync error</text><text x="79" y="171" fill="#4d6069" font-size="12.8">Keep saved material and progress</text></g><g class="flow-node" data-node="model" aria-label="Start model or knowledge work"><title>Daily AI, discovery, and knowledge submission persist their first configuration, results, and usage independently.</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="143" fill="#356495" font-size="17" font-weight="650">Start model or knowledge work</text><text x="474" y="171" fill="#4d6069" font-size="12.8">Save run or submission intent first</text></g><g class="flow-node" data-node="release" aria-label="Prepare an update"><title>Use a separate test Vault and verify old and new plugin and service versions. Keep synthetic material out of the actual library.</title><rect x="850" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="143" fill="#9a6119" font-size="17" font-weight="650">Prepare an update</text><text x="869" y="171" fill="#4d6069" font-size="12.8">Isolated tests · build · signature</text></g><g class="flow-node" data-node="classify" aria-label="Classify the failure"><title>Network recovery can bring eligible network failures forward. Authorization and rate limits keep their schedules. Report storage errors with file evidence.</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#a65353"/><text x="79" y="287" fill="#a65353" font-size="17" font-weight="650">Classify the failure</text><text x="79" y="315" fill="#4d6069" font-size="12.8">Network · access · limits · storage</text></g><g class="flow-node" data-node="result" aria-label="Check the first response"><title>Save the first result and receipt before updating guide or recommendation indexes. Retry only the write after a save error. Keep an unknown outcome for review.</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="287" fill="#a65353" font-size="17" font-weight="650">Check the first response</text><text x="474" y="315" fill="#4d6069" font-size="12.8">Persist a result you already have</text></g><g class="flow-node" data-node="backup" aria-label="Verify and stop the old service"><title>Verify the process identity and perform a graceful stop. Back up the live segmented ledger, index, and associated data.</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="287" fill="#9a6119" font-size="17" font-weight="650">Verify and stop the old service</text><text x="869" y="315" fill="#4d6069" font-size="12.8">Back up the complete live data</text></g><g class="flow-node" data-node="backoff" aria-label="Retry according to error class"><title>Verification pages and missing text may back off up to an hour. Other failures follow their own policies. The next retry is a scheduled time.</title><rect x="60" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="431" fill="#216957" font-size="17" font-weight="650">Retry according to error class</text><text x="79" y="459" fill="#4d6069" font-size="12.8">Network 1 / 2 / 5 / 10 / 15 min</text></g><g class="flow-node" data-node="unknown" aria-label="Keep uncertain work pending"><title>Retain the original run. Wait for a known outcome or inspect the saved material before acting.</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="431" fill="#a65353" font-size="17" font-weight="650">Keep uncertain work pending</text><text x="474" y="459" fill="#4d6069" font-size="12.8">Timeout · started only · unknown send</text></g><g class="flow-node" data-node="upgrade" aria-label="Upgrade and check the service"><title>Check the new program, readiness, and material retention. Prepare the local signed channel after confirmation. Track cloud archive success independently.</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="431" fill="#9a6119" font-size="17" font-weight="650">Upgrade and check the service</text><text x="869" y="459" fill="#4d6069" font-size="12.8">Verify data, then prepare the channel</text></g><g class="flow-node" data-node="catchup" aria-label="Catch up within the window"><title>Process entries still available upstream and within the configured window and start date. Count saved material after required text and original are persisted.</title><rect x="60" y="540" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="559" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="575" fill="#216957" font-size="17" font-weight="650">Catch up within the window</text><text x="79" y="603" fill="#4d6069" font-size="12.8">Up to seven earlier days when enabled</text></g><g class="flow-node" data-node="conflict" aria-label="Keep changed user files"><title>Keep versions independent. Preserve registered annotations. Resolve missing originals, incorrect hashes, or a failed write before proceeding.</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="575" fill="#a65353" font-size="17" font-weight="650">Keep changed user files</text><text x="474" y="603" fill="#4d6069" font-size="12.8">Report missing originals or mismatches</text></g><g class="flow-node" data-node="install" aria-label="Install a verified plugin update"><title>Replace four program files and retain data.json and materials. Recover interrupted installs through their transaction and preserve unexpected external changes.</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="575" fill="#9a6119" font-size="17" font-weight="650">Install a verified plugin update</text><text x="869" y="603" fill="#4d6069" font-size="12.8">Signature · hashes · tasks and drafts</text></g><g class="flow-node" data-node="commit" aria-label="Sync and commit checkpoints"><title>Known annotated notes can coexist with new imports. An original or file write error holds the cursor until the page can complete.</title><rect x="60" y="684" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="60" y="703" width="4" height="54" rx="2" fill="#356495"/><text x="79" y="719" fill="#356495" font-size="17" font-weight="650">Sync and commit checkpoints</text><text x="79" y="747" fill="#4d6069" font-size="12.8">Advance after a successful page</text></g><g class="flow-node" data-node="resume" aria-label="Recover the saved result"><title>Retry saving an existing first response. When recovering a conversation, inspect its receipts read-only on the first round.</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="719" fill="#9a6119" font-size="17" font-weight="650">Recover the saved result</text><text x="474" y="747" fill="#4d6069" font-size="12.8">Check receipts and files first</text></g><g class="flow-node" data-node="cloud" aria-label="Archive encrypted snapshots"><title>Retain cloud dependencies of historical snapshots, keep the password separate, and keep unverified local copies. Active data is outside rotation.</title><rect x="850" y="684" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="703" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="719" fill="#9a6119" font-size="17" font-weight="650">Archive encrypted snapshots</text><text x="869" y="747" fill="#4d6069" font-size="12.8">Private upload · read back · verify files</text></g><g class="flow-node" data-node="retention" aria-label="Rotate verified local snapshots"><title>After cloud read-back and per-file verification, rotate historical local service snapshots. Keep referenced cloud dependencies under their own retention policy.</title><rect x="850" y="828" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="850" y="847" width="4" height="54" rx="2" fill="#a65353"/><text x="869" y="863" fill="#a65353" font-size="17" font-weight="650">Rotate verified local snapshots</text><text x="869" y="891" fill="#4d6069" font-size="12.8">Latest copy of two distinct versions</text></g></svg>