<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1264" role="img" aria-label="Subscription collection and sync" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1262" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">Subscription collection and sync</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Verified</text><path d="M 610 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Failed</text><path d="M 1005 632 V 655 H 1210 V 442 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1197" y="537.0" transform="rotate(-90 1197 537.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Retry when eligible</text><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 610 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 610 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><g class="flow-node" data-node="settings" aria-label="Add or manage a subscription"><title>A source-row toggle saves immediately. Dialog edits require Save. Disabling stops collection and retains saved material.</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="143" fill="#9a6119" font-size="17" font-weight="650">Add or manage a subscription</text><text x="474" y="171" fill="#4d6069" font-size="12.8">Identify URL · category · interval · toggle</text></g><g class="flow-node" data-node="wx" aria-label="WeChat and general RSS"><title>Verify WeChat account, author date, and article text. General RSS/Atom keeps the feed body and can read the original page when needed. Keep private feed URLs in local configuration.</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="287" fill="#216957" font-size="17" font-weight="650">WeChat and general RSS</text><text x="79" y="315" fill="#4d6069" font-size="12.8">Account feed and original-page checks</text></g><g class="flow-node" data-node="yt" aria-label="YouTube"><title>With a configured key, prefer the uploads API. Atom and same-channel public pages are bounded fallbacks. Captions are a separate operation from saving a video entry.</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="287" fill="#216957" font-size="17" font-weight="650">YouTube</text><text x="474" y="315" fill="#4d6069" font-size="12.8">Data API → Atom → public channel page</text></g><g class="flow-node" data-node="bili" aria-label="Bilibili"><title>Verify uploader UID and video identity. Save metadata and viewing links, with the route used in the receipt.</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="869" y="287" fill="#216957" font-size="17" font-weight="650">Bilibili</text><text x="869" y="315" fill="#4d6069" font-size="12.8">RSSHub · public browser fallback</text></g><g class="flow-node" data-node="validate" aria-label="Verify identity, date, and text"><title>The service looks for due sources every 30 seconds. Sources default to hourly. Capture the source config for the check, validate account and link, and apply the author date, text, and catch-up rules. An unsaved item keeps its fingerprint pending.</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="431" fill="#a65353" font-size="17" font-weight="650">Verify identity, date, and text</text><text x="474" y="459" fill="#4d6069" font-size="12.8">Conditional reads · full check every 6 h</text></g><g class="flow-node" data-node="save" aria-label="Deduplicate and write material"><title>Write ledger-entries/&lt;sequence&gt;-&lt;hash&gt;.json, then commit ledger-index.json. The sequence and hash must match the item file. Failure leaves the index or fingerprint unconfirmed. A valid empty feed can succeed with zero items.</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="575" fill="#356495" font-size="17" font-weight="650">Deduplicate and write material</text><text x="474" y="603" fill="#4d6069" font-size="12.8">Identity and version · original and body</text></g><g class="flow-node" data-node="retry" aria-label="Classify and record failures"><title>Network retries after 1, 2, 5, 10, and up to 15 minutes. Authorization and limits have their own deadlines. Early network recovery only applies to eligible network errors.</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#a65353"/><text x="869" y="575" fill="#a65353" font-size="17" font-weight="650">Classify and record failures</text><text x="869" y="603" fill="#4d6069" font-size="12.8">Network · authorization · limits · storage</text></g><g class="flow-node" data-node="feed" aria-label="Serve incremental pages"><title>Verify individual entries and serve new material from the current ledger instance. The earlier ledger.json is historical after migration.</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="719" fill="#356495" font-size="17" font-weight="650">Serve incremental pages</text><text x="474" y="747" fill="#4d6069" font-size="12.8">ledger-index.json + ledger-entries</text></g><g class="flow-node" data-node="sync" aria-label="Sync to Obsidian"><title>When enabled, pull /v1/feed?after=&lt;cursor&gt;&amp;instance=&lt;instance&gt; on startup, workbench opening, and the configured timer. The interval defaults to five minutes. Check and sync starts collection, syncs saved material, and syncs again after the check. The UI follows it for up to three minutes. No model is needed.</title><rect x="455" y="828" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="847" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="863" fill="#216957" font-size="17" font-weight="650">Sync to Obsidian</text><text x="474" y="891" fill="#4d6069" font-size="12.8">Startup · workbench opening · timer</text></g><g class="flow-node" data-node="vault" aria-label="Commit a page to the library"><title>Process each material before advancing the page cursor. Preserve known edited notes, skip trashed identities, and protect writes. A missing original, bad hash, or write failure blocks the checkpoint.</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1007" fill="#356495" font-size="17" font-weight="650">Commit a page to the library</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">Original · note · index · checkpoint</text></g><g class="flow-node" data-node="view" aria-label="Show actual publication dates"><title>Optional catch-up covers up to seven earlier days when the upstream entry and original are still readable. File entries under their original dates.</title><rect x="455" y="1116" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="1135" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="1151" fill="#216957" font-size="17" font-weight="650">Show actual publication dates</text><text x="474" y="1179" fill="#4d6069" font-size="12.8">Day navigation · search · read</text></g></svg>