<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1552" role="img" aria-label="System overview" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1550" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">System overview</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 215 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Startup / open / sync timer</text><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Select to save or reuse</text><path d="M 1005 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 765 298 H 803 V 730 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="790" y="514.0" transform="rotate(-90 790 514.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Open or watch the original</text><path d="M 610 776 V 802.0 H 215 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 610 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Opt into deeper processing</text><path d="M 610 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 215 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 1005 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="1227.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Request synthesis</text><path d="M 1005 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1352 V 1378.0 H 610 V 1404" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="1371.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Authorize a specific target</text><g class="flow-node" data-node="sub" aria-label="Fixed subscriptions"><title>Manage source URLs, categories, check intervals, and enablement in Sources. X appears under Discovery.</title><rect x="60" y="108" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="127" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="143" fill="#216957" font-size="17" font-weight="650">Fixed subscriptions</text><text x="79" y="171" fill="#4d6069" font-size="12.8">WeChat · YouTube · Bilibili · RSS</text></g><g class="flow-node" data-node="explore" aria-label="Discovery"><title>Search by interests and topic areas. The configured light model shortlists up to three picks by default. Automatic discovery is opt-in.</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="143" fill="#70529a" font-size="17" font-weight="650">Discovery</text><text x="474" y="171" fill="#4d6069" font-size="12.8">Web · optional X · saved subscriptions</text></g><g class="flow-node" data-node="manual" aria-label="Add material"><title>Import for reading, for discussion, or for direct Wiki synthesis.</title><rect x="850" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="143" fill="#9a6119" font-size="17" font-weight="650">Add material</text><text x="869" y="171" fill="#4d6069" font-size="12.8">Links · MD · HTML · PDF · captions</text></g><g class="flow-node" data-node="ledger" aria-label="Collect and write the ledger"><title>Poll enabled sources. Save article originals and text when obtained, and video metadata and links. Serve increments from ledger-index.json and ledger-entries.</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="287" fill="#216957" font-size="17" font-weight="650">Collect and write the ledger</text><text x="79" y="315" fill="#4d6069" font-size="12.8">Verify the source · deduplicate · save</text></g><g class="flow-node" data-node="cards" aria-label="Recommendation cards"><title>Save recommendations independently. Choose which external items to capture. Reuse existing subscription text.</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="287" fill="#70529a" font-size="17" font-weight="650">Recommendation cards</text><text x="474" y="315" fill="#4d6069" font-size="12.8">Reason · evidence · source URL · gaps</text></g><g class="flow-node" data-node="import" aria-label="Extract or import"><title>Try public captions or import SRT/VTT. A scanned PDF can be paired with text prepared elsewhere, kept as a distinct version.</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="869" y="287" fill="#216957" font-size="17" font-weight="650">Extract or import</text><text x="869" y="315" fill="#4d6069" font-size="12.8">Keep originals and label coverage</text></g><g class="flow-node" data-node="library" aria-label="Obsidian reading library"><title>Import or sync identified, versioned Material with coverage. Originals, reading notes, and _工作台/state.json track files, progress, and annotations. Confirm that indexed files exist and report conflicts. Keep AI output separately.</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="431" fill="#356495" font-size="17" font-weight="650">Obsidian reading library</text><text x="474" y="459" fill="#4d6069" font-size="12.8">User-selected folder inside the Vault</text></g><g class="flow-node" data-node="today" aria-label="Updates and Today’s Reading"><title>By default the shortlist allows 50 minutes and three items. Browse the full collection independently. Basic selection needs no model. Automatic AI guides default to off.</title><rect x="60" y="540" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="559" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="575" fill="#216957" font-size="17" font-weight="650">Updates and Today’s Reading</text><text x="79" y="603" fill="#4d6069" font-size="12.8">Publication dates and a shortlist</text></g><g class="flow-node" data-node="history" aria-label="Rediscover older unread items"><title>Rotate through historical unread material and deduplicate against that day’s discovery. A saved nonempty list is fixed. Read and trashed items leave the list without replacement.</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="575" fill="#216957" font-size="17" font-weight="650">Rediscover older unread items</text><text x="474" y="603" fill="#4d6069" font-size="12.8">Two per day by default · no model</text></g><g class="flow-node" data-node="shelf" aria-label="Library"><title>Browse collected material and versions. Trash retains originals and notes. Sync skips trashed identities.</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="575" fill="#9a6119" font-size="17" font-weight="650">Library</text><text x="869" y="603" fill="#4d6069" font-size="12.8">Search · reading states · bulk tools</text></g><g class="flow-node" data-node="read" aria-label="Read, watch, and annotate"><title>Open the original, read a captured note, or save progress. Select a specific material to begin knowledge processing.</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="719" fill="#9a6119" font-size="17" font-weight="650">Read, watch, and annotate</text><text x="474" y="747" fill="#4d6069" font-size="12.8">Read locally or open the original</text></g><g class="flow-node" data-node="end" aria-label="Finish the reading session"><title>Finish after reading or watching and return to the note later.</title><rect x="60" y="828" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="847" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="863" fill="#9a6119" font-size="17" font-weight="650">Finish the reading session</text><text x="79" y="891" fill="#4d6069" font-size="12.8">Keep progress and annotations</text></g><g class="flow-node" data-node="handoff" aria-label="Hand a version to Claudian"><title>Check the selected original and text. A video needs actual transcript text for handoff.</title><rect x="455" y="828" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="847" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="863" fill="#9a6119" font-size="17" font-weight="650">Hand a version to Claudian</text><text x="474" y="891" fill="#4d6069" font-size="12.8">Bind version, original, session, queue</text></g><g class="flow-node" data-node="raw" aria-label="Process through RAW"><title>The workbench prepares the handoff and observes receipts. Claudian runs the Vault’s fanos-raw protocol with its selected model. The integration check proves interface compatibility.</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="1007" fill="#70529a" font-size="17" font-weight="650">Process through RAW</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">Verify original · register · extract</text></g><g class="flow-node" data-node="dialogue" aria-label="Discuss and request synthesis"><title>Ask questions, correct the draft, and explicitly request synthesis into the current Wiki.</title><rect x="60" y="1116" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="1135" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="1151" fill="#9a6119" font-size="17" font-weight="650">Discuss and request synthesis</text><text x="79" y="1179" fill="#4d6069" font-size="12.8">Review and refine the first draft</text></g><g class="flow-node" data-node="direct" aria-label="Send directly to the Wiki"><title>Authorize synthesis of the chosen source in the Wiki. Keep private annotations and conversation ideas outside the source inputs.</title><rect x="850" y="1116" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="1135" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1151" fill="#9a6119" font-size="17" font-weight="650">Send directly to the Wiki</text><text x="869" y="1179" fill="#4d6069" font-size="12.8">Explicitly select direct synthesis</text></g><g class="flow-node" data-node="wiki" aria-label="Verify Wiki synthesis"><title>Check the current run’s formal events, selected version, original hash, and outputs on disk.</title><rect x="455" y="1260" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="1279" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1295" fill="#356495" font-size="17" font-weight="650">Verify Wiki synthesis</text><text x="474" y="1323" fill="#4d6069" font-size="12.8">Topic · source record · map · receipt</text></g><g class="flow-node" data-node="fanos" aria-label="Optional promotion to fanOS"><title>Promote to a specified note or board with separate authorization. Wiki and promotion each have their own evidence.</title><rect x="455" y="1404" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="1423" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1439" fill="#9a6119" font-size="17" font-weight="650">Optional promotion to fanOS</text><text x="474" y="1467" fill="#4d6069" font-size="12.8">Authorize the destination and change</text></g></svg>