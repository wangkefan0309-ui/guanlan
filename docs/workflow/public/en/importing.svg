<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1408" role="img" aria-label="Import and transcripts" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1406" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">Import and transcripts</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 215 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 488 V 514.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="215.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Article</text><path d="M 215 488 V 502.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="495.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Cached X post</text><path d="M 610 488 V 526.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="519.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">HTML / PDF</text><path d="M 370 586 H 455" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Local Markdown</text><path d="M 1005 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Text available</text><path d="M 1005 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1005.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Unavailable</text><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 215 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Existing</text><path d="M 610 776 V 802.0 H 610 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">New version</text><path d="M 610 776 V 802.0 H 1005 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Check failed</text><path d="M 215 920 V 943 H 20 V 1162 H 455" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="33" y="1041.0" transform="rotate(-90 33 1041.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Reuse</text><path d="M 610 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 610 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 215 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 1005 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><g class="flow-node" data-node="start" aria-label="Add material or save a pick"><title>Choose import only, import and discuss, or import for direct Wiki synthesis. Handoff follows successful storage.</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="143" fill="#9a6119" font-size="17" font-weight="650">Add material or save a pick</text><text x="474" y="171" fill="#4d6069" font-size="12.8">Select input and follow-up action</text></g><g class="flow-node" data-node="link" aria-label="Article URL or X post"><title>Read a public article. For X use the verified cache for the post text and original response. Replies, linked pages, and transcripts have separate routes.</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="287" fill="#9a6119" font-size="17" font-weight="650">Article URL or X post</text><text x="79" y="315" fill="#4d6069" font-size="12.8">Keep source identity and original URL</text></g><g class="flow-node" data-node="file" aria-label="Markdown, HTML, or PDF"><title>Give updates to the same material a stable identity and distinguish versions by content hash. Use separate IDs for unrelated files with matching names.</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="287" fill="#9a6119" font-size="17" font-weight="650">Markdown, HTML, or PDF</text><text x="474" y="315" fill="#4d6069" font-size="12.8">Stable identity and original bytes</text></g><g class="flow-node" data-node="video" aria-label="Video link or captions file"><title>Try public captions or supply a transcript. Captions are a separate operation from the subscription feed.</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="287" fill="#9a6119" font-size="17" font-weight="650">Video link or captions file</text><text x="869" y="315" fill="#4d6069" font-size="12.8">YouTube · Bilibili · SRT · VTT</text></g><g class="flow-node" data-node="fetch" aria-label="Read the page or cached post"><title>Allow public sites on standard ports and validate redirects. Keep the fetched response and absolute remote image URLs. Extraction runs without webpage scripts, OCR, or a model. A missing or invalid X original blocks capture.</title><rect x="60" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="431" fill="#216957" font-size="17" font-weight="650">Read the page or cached post</text><text x="79" y="459" fill="#4d6069" font-size="12.8">Extract text and record gaps</text></g><g class="flow-node" data-node="parse" aria-label="Parse the file or attach text"><title>Extract an available text layer. Attach Markdown prepared externally for a scan, for example with MinerU. Preserve the PDF and register the conversion separately.</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="431" fill="#216957" font-size="17" font-weight="650">Parse the file or attach text</text><text x="474" y="459" fill="#4d6069" font-size="12.8">Keep the PDF and the conversion</text></g><g class="flow-node" data-node="transcript" aria-label="Read captions or parse SRT/VTT"><title>Mark public captions as partial and report auto captions and visual gaps. Keep original caption bytes and mark reverse or zero-length cues for review.</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="869" y="431" fill="#216957" font-size="17" font-weight="650">Read captions or parse SRT/VTT</text><text x="869" y="459" fill="#4d6069" font-size="12.8">Timestamp and language coverage</text></g><g class="flow-node" data-node="material" aria-label="Create material with coverage"><title>Keep capture, extracted text, and AI output independently. Use the coverage that the material supports.</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="575" fill="#a65353" font-size="17" font-weight="650">Create material with coverage</text><text x="474" y="603" fill="#4d6069" font-size="12.8">Full · partial · metadata only</text></g><g class="flow-node" data-node="backend" aria-label="Save service imports first"><title>Save URL and HTML/PDF imports in the ledger before returning Material. Plugin imports save the return value directly. External HTTP clients sync later. Local MD/SRT/VTT, video captions, and cached X posts follow separate paths.</title><rect x="60" y="540" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="60" y="559" width="4" height="54" rx="2" fill="#356495"/><text x="79" y="575" fill="#356495" font-size="17" font-weight="650">Save service imports first</text><text x="79" y="603" fill="#4d6069" font-size="12.8">POST /v1/import → ledger → Material</text></g><g class="flow-node" data-node="missing" aria-label="Text or captions unavailable"><title>A source may require login or offer no captions. Supply external text for restricted videos, X videos, or extra segments.</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="575" fill="#9a6119" font-size="17" font-weight="650">Text or captions unavailable</text><text x="869" y="603" fill="#4d6069" font-size="12.8">Read the link or supply a transcript</text></g><g class="flow-node" data-node="identity" aria-label="Resolve identity and version"><title>Material ID comes from source identity. The version includes text and coverage. Category, capture time, and AI guides are independent of the text version.</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="719" fill="#a65353" font-size="17" font-weight="650">Resolve identity and version</text><text x="474" y="747" fill="#4d6069" font-size="12.8">Canonical URL or stable file identity</text></g><g class="flow-node" data-node="same" aria-label="Reuse the existing version"><title>Keep the first metadata, position, and annotations for identical content. Restore a trashed item before importing it again.</title><rect x="60" y="828" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="847" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="863" fill="#216957" font-size="17" font-weight="650">Reuse the existing version</text><text x="79" y="891" fill="#4d6069" font-size="12.8">First capture and reading state</text></g><g class="flow-node" data-node="new" aria-label="Save a separate version"><title>Use an independent path for new text. Knowledge success remains tied to the version it processed.</title><rect x="455" y="828" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="847" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="863" fill="#216957" font-size="17" font-weight="650">Save a separate version</text><text x="474" y="891" fill="#4d6069" font-size="12.8">Allocate a new path for the body</text></g><g class="flow-node" data-node="blocked" aria-label="Stop on a file conflict"><title>Missing originals, wrong hashes, and illegal paths need attention. Preserve and report edits in already indexed text.</title><rect x="850" y="828" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="850" y="847" width="4" height="54" rx="2" fill="#a65353"/><text x="869" y="863" fill="#a65353" font-size="17" font-weight="650">Stop on a file conflict</text><text x="869" y="891" fill="#4d6069" font-size="12.8">Preserve user content and report</text></g><g class="flow-node" data-node="save" aria-label="Write through a recovery record"><title>Pin the first material and original in a recovery record before writing. Commit the index last, then clear the recovery record. A null expectation only creates a file. An expected old string is compared atomically before replacing. Keep partial writes and the recovery record on error.</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1007" fill="#356495" font-size="17" font-weight="650">Write through a recovery record</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">Prepared data → original → text → index</text></g><g class="flow-node" data-node="ready" aria-label="Material is in the library"><title>Collecting a single item and subscribing are separate actions. The plugin saves imports immediately. HTTP clients can sync service imports later. Captions, X posts, and locally parsed MD/SRT/VTT remain separate from the service feed.</title><rect x="455" y="1116" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="1135" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1151" fill="#356495" font-size="17" font-weight="650">Material is in the library</text><text x="474" y="1179" fill="#4d6069" font-size="12.8">Read, annotate, search, or hand off</text></g><g class="flow-node" data-node="read" aria-label="Import only"><title>Save or read independently of Claudian. Formal RAW registration is a later opt-in.</title><rect x="60" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="1295" fill="#9a6119" font-size="17" font-weight="650">Import only</text><text x="79" y="1323" fill="#4d6069" font-size="12.8">Read at your own pace</text></g><g class="flow-node" data-node="discuss" aria-label="Import and discuss"><title>Freeze the text and prepare the handoff and queue. Claudian verifies and registers the actual RAW.</title><rect x="455" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1295" fill="#9a6119" font-size="17" font-weight="650">Import and discuss</text><text x="474" y="1323" fill="#4d6069" font-size="12.8">Queue the version for a first draft</text></g><g class="flow-node" data-node="direct" aria-label="Import for direct synthesis"><title>Direct synthesis retains the original and version checks. Personal notes and boards need a separately specified target.</title><rect x="850" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1295" fill="#9a6119" font-size="17" font-weight="650">Import for direct synthesis</text><text x="869" y="1323" fill="#4d6069" font-size="12.8">Authorize the selected Wiki operation</text></g></svg>