<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1264" role="img" aria-label="Reading and selection" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1262" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">Reading and selection</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 215 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 200 V 226.0 H 1005 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 344 V 370.0 H 215 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 488 V 514.0 H 215 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="215.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Opt in</text><path d="M 215 488 V 511 H 20 V 1018 H 455" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="33" y="753.0" transform="rotate(-90 33 753.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Read directly</text><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 488 V 514.0 H 1005 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1005.0" y="507.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Trash</text><path d="M 1005 488 V 511 H 1210 V 1018 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1197" y="753.0" transform="rotate(-90 1197 753.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Read / update state</text><path d="M 1005 632 V 658.0 H 1005 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 765 586 H 803 V 1018 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="790" y="802.0" transform="rotate(-90 790 802.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Open original version</text><path d="M 215 632 V 658.0 H 215 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 776 V 802.0 H 215 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 776 V 874.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 215 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 1005 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><g class="flow-node" data-node="library" aria-label="Shared library and index"><title>Updates, Rediscover, and Library reuse the same ReadingLibrary, its files, indexes, versions, and annotations.</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="143" fill="#356495" font-size="17" font-weight="650">Shared library and index</text><text x="474" y="171" fill="#4d6069" font-size="12.8">Use the same notes and original files</text></g><g class="flow-node" data-node="today" aria-label="Today’s reading candidates"><title>Group by author publication date. Exclude read, read-later, metadata-only, and verification material from selection. Prioritize readings in progress and avoid stale news.</title><rect x="60" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="287" fill="#216957" font-size="17" font-weight="650">Today’s reading candidates</text><text x="79" y="315" fill="#4d6069" font-size="12.8">Saved text from subscriptions</text></g><g class="flow-node" data-node="old" aria-label="Older unread candidates"><title>For an unknown publication date, use the local save boundary for historical eligibility. Videos may be selected with an original link and a transcript coverage label.</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="287" fill="#216957" font-size="17" font-weight="650">Older unread candidates</text><text x="474" y="315" fill="#4d6069" font-size="12.8">Search across the library’s history</text></g><g class="flow-node" data-node="all" aria-label="All saved material"><title>Filter by unread, reading, read later, or read. Browse older dates. Bulk selection covers all matching pages.</title><rect x="850" y="252" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="271" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="287" fill="#9a6119" font-size="17" font-weight="650">All saved material</text><text x="869" y="315" fill="#4d6069" font-size="12.8">Search dates, sources, and states</text></g><g class="flow-node" data-node="rule" aria-label="Build a rule-based shortlist"><title>Estimate at 450 characters per minute by default. Balance categories and prioritize readings in progress. Compare before updating a saved list and report user edits.</title><rect x="60" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="431" fill="#216957" font-size="17" font-weight="650">Build a rule-based shortlist</text><text x="79" y="459" fill="#4d6069" font-size="12.8">Default 50 minutes and three items</text></g><g class="flow-node" data-node="rotate" aria-label="Rotate older unread items"><title>Favor less-recommended material while considering priority, active reading, positive assessment, and backlog age. Repeat after seven days for unread or 14 for read later.</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="431" fill="#216957" font-size="17" font-weight="650">Rotate older unread items</text><text x="474" y="459" fill="#4d6069" font-size="12.8">Two by default · configurable 1–5</text></g><g class="flow-node" data-node="manage" aria-label="Bulk state changes and trash"><title>Update at article identity level. Trash moves all versions into the reading index’s trash and retains their files. Unsaved drafts require attention first.</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="431" fill="#9a6119" font-size="17" font-weight="650">Bulk state changes and trash</text><text x="869" y="459" fill="#4d6069" font-size="12.8">Keep annotations and reading position</text></g><g class="flow-node" data-node="ai" aria-label="Optional AI picks and guides"><title>Use the configured light model, one batch per day by default. Reuse the same batch. Failed or uncertain attempts count toward the daily limit.</title><rect x="60" y="540" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="559" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="575" fill="#9a6119" font-size="17" font-weight="650">Optional AI picks and guides</text><text x="79" y="603" fill="#4d6069" font-size="12.8">Manual or explicitly enabled</text></g><g class="flow-node" data-node="refs" aria-label="Save fixed version references"><title>Save identity, fixed version, reason, and date in historyDays in _工作台/state.json. Keep the registered version when a new one arrives. A saved nonempty list is fixed. Quantity changes apply on later days. Restore its index and reading folder together.</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="575" fill="#356495" font-size="17" font-weight="650">Save fixed version references</text><text x="474" y="603" fill="#4d6069" font-size="12.8">Deduplicate with today’s discovery</text></g><g class="flow-node" data-node="trash" aria-label="Move to recoverable trash"><title>Deletion applies to the current library. The shared ledger keeps its copy, and sync skips trashed identities. Existing knowledge tasks remain recorded.</title><rect x="850" y="540" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="850" y="559" width="4" height="54" rx="2" fill="#356495"/><text x="869" y="575" fill="#356495" font-size="17" font-weight="650">Move to recoverable trash</text><text x="869" y="603" fill="#4d6069" font-size="12.8">Keep original, text, and versions</text></g><g class="flow-node" data-node="review" aria-label="Sample, score, and validate"><title>Give the model up to eight numbered quote choices and resolve references to the original text. PASS at 40 or above contributes to AI ranking. Unreviewed items keep rule ordering. Save started before calling and retry persistence of the first result.</title><rect x="60" y="684" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="60" y="703" width="4" height="54" rx="2" fill="#70529a"/><text x="79" y="719" fill="#70529a" font-size="17" font-weight="650">Sample, score, and validate</text><text x="79" y="747" fill="#4d6069" font-size="12.8">Up to 12 pieces · 2,400 chars each</text></g><g class="flow-node" data-node="restore" aria-label="Restore the original item"><title>Restore all versions and continue identity-based deduplication. Discovery and Wiki processing remain independent actions.</title><rect x="850" y="684" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="703" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="719" fill="#9a6119" font-size="17" font-weight="650">Restore the original item</text><text x="869" y="747" fill="#4d6069" font-size="12.8">Same paths, versions, states, notes</text></g><g class="flow-node" data-node="guide" aria-label="Save guides and evidence"><title>Save the guide, matched quote, and usage before updating indexes. Preserve invalid output in its model receipt. On write error retry saving the same result.</title><rect x="60" y="828" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="60" y="847" width="4" height="54" rx="2" fill="#356495"/><text x="79" y="863" fill="#356495" font-size="17" font-weight="650">Save guides and evidence</text><text x="79" y="891" fill="#4d6069" font-size="12.8">Separate guide, evidence, and usage</text></g><g class="flow-node" data-node="read" aria-label="Read, watch, and annotate"><title>Choose the reading state. Resolve unsaved note edits before bulk changes or knowledge tasks that would affect the draft.</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1007" fill="#9a6119" font-size="17" font-weight="650">Read, watch, and annotate</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">Source text, short guide, and position</text></g><g class="flow-node" data-node="finish" aria-label="Finish reading"><title>Reading or watching completes the reading task. Wiki synthesis starts with a specific handoff.</title><rect x="60" y="1116" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="1135" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="1151" fill="#9a6119" font-size="17" font-weight="650">Finish reading</text><text x="79" y="1179" fill="#4d6069" font-size="12.8">Return to the saved position later</text></g><g class="flow-node" data-node="continue" aria-label="Choose knowledge processing"><title>Use actual text and originals from the chosen version. Supply missing evidence before calling Claudian.</title><rect x="850" y="1116" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="1135" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1151" fill="#9a6119" font-size="17" font-weight="650">Choose knowledge processing</text><text x="869" y="1179" fill="#4d6069" font-size="12.8">Discuss and synthesize, or send directly</text></g></svg>