<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1408" role="img" aria-label="Knowledge handoff" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1406" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">Knowledge handoff</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Text and original verified</text><path d="M 610 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="363.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Missing / conflict</text><path d="M 1005 488 V 511 H 1210 V 298 H 765" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="1197" y="393.0" transform="rotate(-90 1197 393.0)" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Resolved</text><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 215 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 1005 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="412.5" y="939.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Request synthesis</text><path d="M 1005 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="939.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Direct synthesis selected</text><path d="M 610 1064 V 1090.0 H 610 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="1227.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Authorize target separately</text><g class="flow-node" data-node="choose" aria-label="Select a specific version"><title>Choose a version from a reading view, discovery card, or import. Knowledge work starts with explicit selection.</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="143" fill="#9a6119" font-size="17" font-weight="650">Select a specific version</text><text x="474" y="171" fill="#4d6069" font-size="12.8">Discussion or direct synthesis</text></g><g class="flow-node" data-node="check" aria-label="Verify the text and original"><title>Protect the original and frozen source text with hashes. Keep AI guides separate from the source snapshot.</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="287" fill="#a65353" font-size="17" font-weight="650">Verify the text and original</text><text x="474" y="315" fill="#4d6069" font-size="12.8">Captions · original PDF · hashes</text></g><g class="flow-node" data-node="missing" aria-label="Resolve input conflicts"><title>Supply external text when a video caption is unavailable or a scan needs OCR. Preserve changed files and report mismatches.</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="431" fill="#9a6119" font-size="17" font-weight="650">Resolve input conflicts</text><text x="869" y="459" fill="#4d6069" font-size="12.8">Supply captions or convert a scan</text></g><g class="flow-node" data-node="queue" aria-label="Persist handoff and queue"><title>Keep the task note and frozen source in 知识接续 and private receipts in _工作台/知识接续. Bind identity, version, original hash, and conversation. Submit in order after the current RAW task and any active reply or text/image draft. Unsent items can be canceled.</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="431" fill="#356495" font-size="17" font-weight="650">Persist handoff and queue</text><text x="474" y="459" fill="#4d6069" font-size="12.8">Task note · frozen source · mode</text></g><g class="flow-node" data-node="bridge" aria-label="Verify and record send intent"><title>Use the historical 2.3.17 adapter or verify the installed version and interface. Validation sends no message and calls no model. Store the binding and submission intent before sending. Reuse the conversation on repeat clicks and preserve unconfirmed intent.</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="575" fill="#a65353" font-size="17" font-weight="650">Verify and record send intent</text><text x="474" y="603" fill="#4d6069" font-size="12.8">Check before sending via Claudian</text></g><g class="flow-node" data-node="raw" aria-label="Run the Vault’s RAW protocol"><title>Claudian uses its selected model and the Vault’s fanos-raw protocol. The workbench’s light model serves a separate workflow.</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="719" fill="#70529a" font-size="17" font-weight="650">Run the Vault’s RAW protocol</text><text x="474" y="747" fill="#4d6069" font-size="12.8">Copy and hash-check · register · extract</text></g><g class="flow-node" data-node="discussion" aria-label="Wait for discussion"><title>Discuss the draft. Explicitly request synthesis into the Wiki once you are ready.</title><rect x="60" y="828" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="847" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="863" fill="#9a6119" font-size="17" font-weight="650">Wait for discussion</text><text x="79" y="891" fill="#4d6069" font-size="12.8">Draft → questions → synthesis request</text></g><g class="flow-node" data-node="direct" aria-label="Synthesize without discussion"><title>The direct choice authorizes synthesis in 08_LLM Wiki. Integrate with existing topics when appropriate, keep private annotations separate, and distinguish author claims from verified facts.</title><rect x="850" y="828" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="847" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="863" fill="#9a6119" font-size="17" font-weight="650">Synthesize without discussion</text><text x="869" y="891" fill="#4d6069" font-size="12.8">Use the selected source text</text></g><g class="flow-node" data-node="wiki" aria-label="Write 08_LLM Wiki outputs"><title>Claudian saves the files and finalize event. Stop and report original, version, or file conflicts.</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1007" fill="#356495" font-size="17" font-weight="650">Write 08_LLM Wiki outputs</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">Topic · source file · map · receipt</text></g><g class="flow-node" data-node="observe" aria-label="Verify current-run outcomes"><title>Queued means that material, original, snapshot, task note, and intent were saved. Submitted waits for a formal receipt. Verify RAW registration, discussion, Wiki synthesis, and optional promotion against the current run and actual files.</title><rect x="455" y="1116" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="1135" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="1151" fill="#a65353" font-size="17" font-weight="650">Verify current-run outcomes</text><text x="474" y="1179" fill="#4d6069" font-size="12.8">Version · hash · event · actual files</text></g><g class="flow-node" data-node="fanos" aria-label="Promote to an authorized target"><title>Specify and authorize the destination and changes. Verify post-write hash and source, Wiki, and target backlinks. Preserve later edits and report conflicts.</title><rect x="455" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1295" fill="#9a6119" font-size="17" font-weight="650">Promote to an authorized target</text><text x="474" y="1323" fill="#4d6069" font-size="12.8">Write note or board · verify backlinks</text></g></svg>