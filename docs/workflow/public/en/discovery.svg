<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1552" role="img" aria-label="Discovery" style="font-family:Microsoft YaHei,system-ui,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91a4ad"/></marker></defs><rect x="1" y="1" width="1228" height="1550" rx="18" fill="#f9fbfb" stroke="#cbd8d8"/><path d="M 1 80 H 1229" stroke="#dbe5e5"/><rect x="33" y="25" width="5" height="31" rx="2" fill="#317963"/><text x="53" y="48" font-size="24" font-weight="700" fill="#203c42">Discovery</text><text x="1182" y="47" text-anchor="end" font-size="14" font-weight="650" letter-spacing="2" fill="#4c6c6c">GUANLAN</text><path d="M 610 200 V 226.0 H 610 V 252" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 215 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 610 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 344 V 370.0 H 1005 V 396" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 488 V 514.0 H 610 V 540" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 632 V 658.0 H 610 V 684" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 776 V 802.0 H 610 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="610.0" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">Meets threshold</text><path d="M 610 776 V 802.0 H 1005 V 828" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><text x="807.5" y="795.0" text-anchor="middle" font-size="12" fill="#536872" stroke="#fafcfb" stroke-width="5" paint-order="stroke">No eligible items</text><path d="M 610 920 V 946.0 H 215 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 920 V 946.0 H 610 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 920 V 946.0 H 1005 V 972" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1064 V 1090.0 H 610 V 1116" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 215 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 610 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1208 V 1234.0 H 1005 V 1260" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 215 1352 V 1378.0 H 610 V 1404" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 610 1352 V 1378.0 H 610 V 1404" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><path d="M 1005 1352 V 1378.0 H 610 V 1404" fill="none" stroke="#91a4ad" stroke-width="1.65" marker-end="url(#arrow)"/><g class="flow-node" data-node="trigger" aria-label="Start discovery"><title>Automatic discovery checks on startup, workbench opening, hourly ticks, and return to the window. Recovery considers the current day.</title><rect x="455" y="108" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="127" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="143" fill="#9a6119" font-size="17" font-weight="650">Start discovery</text><text x="474" y="171" fill="#4d6069" font-size="12.8">Manual or opt-in automatic run</text></g><g class="flow-node" data-node="day" aria-label="Check today’s run"><title>Save today’s Rediscover references and exclude their URLs before a new batch. Failure to persist stops discovery. Save state and run logs under _工作台/探索. Completed, failed, or uncertain runs are kept and not resent.</title><rect x="455" y="252" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="455" y="271" width="4" height="54" rx="2" fill="#a65353"/><text x="474" y="287" fill="#a65353" font-size="17" font-weight="650">Check today’s run</text><text x="474" y="315" fill="#4d6069" font-size="12.8">Reserve Rediscover references first</text></g><g class="flow-node" data-node="web" aria-label="Search the web"><title>DeepSeek search uses the configured model connection. Keyless HN/GitHub search leans toward technology. Tavily uses a separate key.</title><rect x="60" y="396" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="60" y="415" width="4" height="54" rx="2" fill="#70529a"/><text x="79" y="431" fill="#70529a" font-size="17" font-weight="650">Search the web</text><text x="79" y="459" fill="#4d6069" font-size="12.8">DeepSeek · public search · Tavily</text></g><g class="flow-node" data-node="x" aria-label="Optional X search"><title>Read up to three Top pages per day and up to 20 posts per page, without pagination. A failed or uncertain attempt pauses new requests that day. SocialData is an explicit paid choice.</title><rect x="455" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="431" fill="#216957" font-size="17" font-weight="650">Optional X search</text><text x="474" y="459" fill="#4d6069" font-size="12.8">Own account · shared daily cache</text></g><g class="flow-node" data-node="subs" aria-label="Add recent subscription text"><title>Reuse saved text and mark it as a subscription candidate. Exclude read, dismissed, and recently recommended URLs.</title><rect x="850" y="396" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="850" y="415" width="4" height="54" rx="2" fill="#216957"/><text x="869" y="431" fill="#216957" font-size="17" font-weight="650">Add recent subscription text</text><text x="869" y="459" fill="#4d6069" font-size="12.8">Recent seven days · up to six items</text></g><g class="flow-node" data-node="evidence" aria-label="Merge and check evidence"><title>Verify up to six web pages and read excerpts of up to three X external links. Distinguish posts, linked excerpts, and unseen video.</title><rect x="455" y="540" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="559" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="575" fill="#216957" font-size="17" font-weight="650">Merge and check evidence</text><text x="474" y="603" fill="#4d6069" font-size="12.8">Up to 24 candidates · bounded checks</text></g><g class="flow-node" data-node="score" aria-label="Score with the model and code"><title>Give the light model up to 24 excerpts of up to 2,400 characters. Code also checks evidence, concrete novelty or utility, and known substance. Leave unassessed substance empty. Reject invalid fields, out-of-range values, or broken references. Search and scoring usage are separate.</title><rect x="455" y="684" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="703" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="719" fill="#70529a" font-size="17" font-weight="650">Score with the model and code</text><text x="474" y="747" fill="#4d6069" font-size="12.8">PASS · value ≥ 60 · relevance ≥ 6</text></g><g class="flow-node" data-node="zero" aria-label="Save fewer picks or none"><title>Titles, engagement counts, or unseen videos provide limited evidence. Keep the threshold and report empty results or gaps.</title><rect x="850" y="828" width="310" height="92" rx="13" fill="#fbefef" stroke="#a65353" stroke-opacity="0.25"/><rect x="850" y="847" width="4" height="54" rx="2" fill="#a65353"/><text x="869" y="863" fill="#a65353" font-size="17" font-weight="650">Save fewer picks or none</text><text x="869" y="891" fill="#4d6069" font-size="12.8">Keep rejections and failure reasons</text></g><g class="flow-node" data-node="picks" aria-label="Discovery picks"><title>Diversify topics and authors. Exclude same-day Rediscover links, read and trashed items, dismissed entries, and the previous 30 days of recommendations. Keep run and publication dates separate.</title><rect x="455" y="828" width="310" height="92" rx="13" fill="#f0edfa" stroke="#70529a" stroke-opacity="0.25"/><rect x="455" y="847" width="4" height="54" rx="2" fill="#70529a"/><text x="474" y="863" fill="#70529a" font-size="17" font-weight="650">Discovery picks</text><text x="474" y="891" fill="#4d6069" font-size="12.8">Up to three by default · event dedup</text></g><g class="flow-node" data-node="open" aria-label="Open or watch the original"><title>Opening the link is browsing. Capture is a separate action with its text and caption coverage recorded.</title><rect x="60" y="972" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="60" y="991" width="4" height="54" rx="2" fill="#9a6119"/><text x="79" y="1007" fill="#9a6119" font-size="17" font-weight="650">Open or watch the original</text><text x="79" y="1035" fill="#4d6069" font-size="12.8">Read on the source platform</text></g><g class="flow-node" data-node="collect" aria-label="Choose what to capture"><title>Save the X post’s own text and its original response. Replies, linked pages, and videos have separate coverage. Articles use link import.</title><rect x="455" y="972" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="991" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1007" fill="#9a6119" font-size="17" font-weight="650">Choose what to capture</text><text x="474" y="1035" fill="#4d6069" font-size="12.8">Save text, get captions, or reuse a note</text></g><g class="flow-node" data-node="reject" aria-label="Dismiss a recommendation"><title>Keep the rejection in exclusions. Preserve the daily run and prior scores.</title><rect x="850" y="972" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="991" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1007" fill="#9a6119" font-size="17" font-weight="650">Dismiss a recommendation</text><text x="869" y="1035" fill="#4d6069" font-size="12.8">Exclude its URL from later discovery</text></g><g class="flow-node" data-node="readlib" aria-label="Save to the shared library"><title>Reuse identical content and save changed versions independently. Keep source text, annotations, and AI outputs separately.</title><rect x="455" y="1116" width="310" height="92" rx="13" fill="#eaf2fc" stroke="#356495" stroke-opacity="0.25"/><rect x="455" y="1135" width="4" height="54" rx="2" fill="#356495"/><text x="474" y="1151" fill="#356495" font-size="17" font-weight="650">Save to the shared library</text><text x="474" y="1179" fill="#4d6069" font-size="12.8">Original · version · progress · notes</text></g><g class="flow-node" data-node="today" aria-label="Open Today’s Reading"><title>Use rules for the shortlist. Optional AI defaults to a daily batch of up to 12 pieces, with up to 2,400 characters each.</title><rect x="60" y="1260" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="60" y="1279" width="4" height="54" rx="2" fill="#216957"/><text x="79" y="1295" fill="#216957" font-size="17" font-weight="650">Open Today’s Reading</text><text x="79" y="1323" fill="#4d6069" font-size="12.8">Default 50 minutes and three items</text></g><g class="flow-node" data-node="history" aria-label="Rediscover older material"><title>No model call. Repeat after seven days for unread and 14 for read later. A saved daily list does not refill after reading or deletion.</title><rect x="455" y="1260" width="310" height="92" rx="13" fill="#edf5f2" stroke="#216957" stroke-opacity="0.25"/><rect x="455" y="1279" width="4" height="54" rx="2" fill="#216957"/><text x="474" y="1295" fill="#216957" font-size="17" font-weight="650">Rediscover older material</text><text x="474" y="1323" fill="#4d6069" font-size="12.8">Default two picks · rotate unread items</text></g><g class="flow-node" data-node="shelf" aria-label="Search and manage materials"><title>Trash keeps originals and versions. Sync skips trashed identities. Handle unsaved drafts before bulk operations.</title><rect x="850" y="1260" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="850" y="1279" width="4" height="54" rx="2" fill="#9a6119"/><text x="869" y="1295" fill="#9a6119" font-size="17" font-weight="650">Search and manage materials</text><text x="869" y="1323" fill="#4d6069" font-size="12.8">Unread · reading · later · read</text></g><g class="flow-node" data-node="read" aria-label="Read and save progress"><title>Choose the reading state yourself. Select a specific material when you want knowledge processing.</title><rect x="455" y="1404" width="310" height="92" rx="13" fill="#fff5e6" stroke="#9a6119" stroke-opacity="0.25"/><rect x="455" y="1423" width="4" height="54" rx="2" fill="#9a6119"/><text x="474" y="1439" fill="#9a6119" font-size="17" font-weight="650">Read and save progress</text><text x="474" y="1467" fill="#4d6069" font-size="12.8">Finish reading or choose handoff</text></g></svg>